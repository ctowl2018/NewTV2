name: Build & Release (leanback)

# 每次 push 到 main 即构建 release 版并发布 GitHub Release。
# 版本号自动递增：v5.8.7（基准）+ github.run_number → v5.8.8、v5.8.9 …
# 应用内更新检查（Github.REPO = ctowl2018/NewTV2）会据此提示更新。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Put SDK tools on PATH
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK packages (platform, build-tools, NDK, CMake)
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Prepare local.properties (signing + SDK)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "cmake.dir=$ANDROID_HOME/cmake/3.22.1" >> local.properties
          echo "storeFile=$GITHUB_WORKSPACE/keystore/release.jks" >> local.properties
          echo "keyAlias=fongmi" >> local.properties
          echo "keyPassword=fongmi123" >> local.properties
          echo "storePassword=fongmi123" >> local.properties
          cat local.properties

      - name: Compute version
        id: ver
        run: |
          PATCH=$((7 + RUN_NUMBER))
          echo "version_name=5.8.${PATCH}" >> "$GITHUB_OUTPUT"
          echo "version_code=$((587 + RUN_NUMBER))" >> "$GITHUB_OUTPUT"

      - name: Build leanback release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleLeanbackRelease \
            -PappVersionName="${{ steps.ver.outputs.version_name }}" \
            -PappVersionCode="${{ steps.ver.outputs.version_code }}" \
            --no-configuration-cache --no-daemon --stacktrace

      - name: Rename APKs for updater
        run: |
          cd app/build/outputs/apk/leanback/release
          mv -f app-leanback-arm64-v8a-release.apk leanback-arm64_v8a.apk
          mv -f app-leanback-armeabi-v7a-release.apk leanback-armeabi_v7a.apk
          ls -l

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version_name }}
          name: NewTV2 v${{ steps.ver.outputs.version_name }}
          body: |
            Automated leanback (TV) release built from commit `${{ github.sha }}`.

            Signed with the project's debug-equivalent key so it installs over existing debug builds.
            Auto-update source: ctowl2018/NewTV2.
          files: |
            app/build/outputs/apk/leanback/release/leanback-arm64_v8a.apk
            app/build/outputs/apk/leanback/release/leanback-armeabi_v7a.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
