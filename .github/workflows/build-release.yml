name: Build & Release (leanback)

# 每次 push 到 main 即构建 release 版并发布 GitHub Release。
# 版本号规则：<上游版本号>.NewTV2.<YYYYMMDD>.<HHMMSS>
#   例：5.8.7.NewTV2.20261113.173045（UPSTREAM_VERSION 在下方 Compute version 步骤维护）
# versionCode 用「Unix 秒 - 1700000000」保证单调递增且不超 int 上限。
# 应用内更新检查（Github.REPO = ctowl2018/NewTV2）按 语义版本 + 时间戳 判定更新。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK & packages
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;28.2.13676358" "cmake;3.22.1"

      - name: Prepare local.properties (signing + SDK)
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "cmake.dir=$ANDROID_HOME/cmake/3.22.1" >> local.properties
          echo "storeFile=$GITHUB_WORKSPACE/keystore/release.jks" >> local.properties
          echo "keyAlias=fongmi" >> local.properties
          echo "keyPassword=fongmi123" >> local.properties
          echo "storePassword=fongmi123" >> local.properties
          cat local.properties

      - name: Compute version
        id: ver
        env:
          UPSTREAM_VERSION: "5.8.7"
        run: |
          DATE=$(date +%Y%m%d)
          TIME=$(date +%H%M%S)
          echo "version_name=${UPSTREAM_VERSION}.NewTV2.${DATE}.${TIME}" >> "$GITHUB_OUTPUT"
          echo "version_code=$(( $(date +%s) - 1700000000 ))" >> "$GITHUB_OUTPUT"

      - name: Build leanback release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleLeanbackRelease \
            -PappVersionName="${{ steps.ver.outputs.version_name }}" \
            -PappVersionCode="${{ steps.ver.outputs.version_code }}" \
            --no-configuration-cache --no-daemon --stacktrace

      - name: Prepare APKs for updater
        run: |
          cd app/build/outputs/apk/leanback/release
          shopt -s nullglob
          for target in arm64_v8a armeabi_v7a; do
            cand=$(ls *"${target}"*.apk 2>/dev/null | head -1)
            if [ -n "$cand" ] && [ "$cand" != "leanback-${target}.apk" ]; then
              mv -f "$cand" "leanback-${target}.apk"
            fi
          done
          ls -l

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version_name }}
          name: NewTV2 v${{ steps.ver.outputs.version_name }}
          body: |
            Automated leanback (TV) release built from commit `${{ github.sha }}`.

            Signed with the project's debug-equivalent key so it installs over existing debug builds.
            Auto-update source: ctowl2018/NewTV2.
          files: |
            app/build/outputs/apk/leanback/release/leanback-arm64_v8a.apk
            app/build/outputs/apk/leanback/release/leanback-armeabi_v7a.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
